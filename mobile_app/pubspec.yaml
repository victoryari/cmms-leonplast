name: cmms_leonplast_mobile
description: "App Móvil de Mantenimiento CMMS Leonplast - Movilidad Avanzada, Offline Autónomo, Firma Digital, Speech-to-Text y NFC."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  connectivity_plus: ^6.0.3
  flutter_secure_storage: ^9.2.2
  signature: ^5.5.0
  speech_to_text: ^7.0.0
  mobile_scanner: ^5.1.1
  nfc_manager: ^3.3.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
